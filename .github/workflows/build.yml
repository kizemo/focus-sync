name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  spike:
    name: Build spike.exe (Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Build spike (release)
        # NOTE: --locked removed temporarily to regen Cargo.lock after adding axum dep.
        # After this run commits a fresh Cargo.lock, re-add --locked.
        run: cargo build --release

      - name: Verify spike.exe
        shell: pwsh
        run: |
          $exe = "target\release\spike.exe"
          if (-not (Test-Path $exe)) { throw "spike.exe not found" }
          $size = (Get-Item $exe).Length
          Write-Host "spike.exe size: $size bytes"
          if ($size -lt 1MB) { throw "spike.exe suspiciously small" }

      - name: Run unit tests
        # NOTE: --locked removed temporarily to match build step.
        run: cargo test --lib

      - name: Upload regenerated Cargo.lock
        # While --locked is temporarily removed, upload the lock file so a human
        # can download + commit the new version, then re-add --locked.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-cargo-lock
          path: spike/Cargo.lock
          if-no-files-found: ignore

      - name: Upload spike.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: spike-windows-x64
          path: spike/target/release/spike.exe
          if-no-files-found: error

  extension:
    name: Build extension (TS bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # No cache-dependency-path because package-lock.json is not yet committed
        # (run `npm install` locally and commit it for reproducible CI).
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build extension bundle
        run: npm run build

      - name: Verify dist/index.js exists
        run: |
          if [ ! -f dist/index.js ]; then
            echo "ERROR: dist/index.js missing"
            exit 1
          fi
          echo "Built dist/index.js:"
          ls -la dist/

      - name: Upload extension bundle
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist/
          if-no-files-found: error

  integration:
    name: Smoke test spike HTTP mode
    runs-on: windows-latest
    needs: spike
    steps:
      - uses: actions/checkout@v4

      - name: Download spike.exe
        uses: actions/download-artifact@v4
        with:
          name: spike-windows-x64
          path: spike/

      - name: Start spike (HTTP mode)
        shell: pwsh
        run: |
          $spike = "spike\spike.exe"
          # --no-uia: skip UIA monitor + COM init. CI Windows Server runners
          # have no desktop session and no UIAutomationCore, so the monitor
          # would otherwise panic and tear down the process.
          $proc = Start-Process -FilePath $spike `
            -ArgumentList "--ipc", "http", "--port", "37422", "--no-uia" `
            -PassThru -NoNewWindow `
            -RedirectStandardOutput spike.out.log `
            -RedirectStandardError spike.err.log
          # Poll /health up to 30s (COM init + UIA monitor + HTTP bind can be slow on CI runners).
          $ready = $false
          for ($i = 1; $i -le 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:37422/health" `
                -UseBasicParsing -TimeoutSec 2 -ErrorAction Stop
              if ($r.StatusCode -eq 200) {
                Write-Host "spike ready after ${i}s"
                $ready = $true
                break
              }
            } catch {
              # Not ready yet, keep polling
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Write-Host "=== spike.out.log ==="
            if (Test-Path spike.out.log) { Get-Content spike.out.log }
            Write-Host "=== spike.err.log ==="
            if (Test-Path spike.err.log) { Get-Content spike.err.log }
            $procs = Get-Process -Name spike -ErrorAction SilentlyContinue
            if ($procs) {
              Write-Host "spike PIDs: $($procs.Id -join ', ')"
              $procs | Stop-Process -Force
            }
            throw "spike did not become ready within 30s"
          }

      - name: Hit /health (re-verify)
        shell: pwsh
        run: |
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:37422/health" -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "health failed: $($r.StatusCode)" }
          $body = $r.Content | ConvertFrom-Json
          if (-not $body.ok) { throw "health body invalid" }
          Write-Host "health OK: $($body | ConvertTo-Json)"

      - name: POST /set_path
        shell: pwsh
        run: |
          $body = @{ path = "C:\Users\Public" } | ConvertTo-Json
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:37422/set_path" `
            -Method POST -Body $body -ContentType "application/json" -UseBasicParsing
          if ($r.StatusCode -ne 200) { throw "set_path failed: $($r.StatusCode)" }
          Write-Host "set_path OK"

      - name: GET /get_status
        shell: pwsh
        run: |
          $r = Invoke-WebRequest -Uri "http://127.0.0.1:37422/get_status" -UseBasicParsing
          $body = $r.Content | ConvertFrom-Json
          if ($body.current_path -ne "C:\Users\Public") {
            throw "expected current_path=C:\Users\Public, got $($body.current_path)"
          }
          Write-Host "get_status OK: $($body | ConvertTo-Json)"

      - name: POST /quit (cleanup)
        shell: pwsh
        run: |
          try {
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:37422/quit" `
              -Method POST -UseBasicParsing -TimeoutSec 2
          } catch { Write-Host "quit closed connection (expected)" }
          Start-Sleep -Seconds 1
          $procs = Get-Process -Name spike -ErrorAction SilentlyContinue
          if ($procs) {
            Write-Host "spike still running, killing"
            $procs | Stop-Process -Force
          }